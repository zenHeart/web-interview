<svg
  width="100"
  height="100"
  viewBox="0 0 100 100"
  xmlns="http://www.w3.org/2000/svg"
>
  <style>
    :root {
      /* Default (light mode) colors */
      --main-color: #000; /* Black for brackets and outer circle */
      --accent-color: #fff; /* White for hollow circle and semicircle */
    }

    @media (prefers-color-scheme: dark) {
      :root {
        /* Dark mode colors */
        --main-color: #fff; /* White for brackets and outer circle */
        --accent-color: #000; /* Black for hollow circle and semicircle */
      }
    }

    /* Apply colors using custom properties */
    .outer-circle, .bracket {
      fill: var(--main-color);
    }

    .hollow-circle, .semicircle-path {
      fill: var(--accent-color);
    }
  </style>

  <text x="30" y="68" font-size="48" font-family="monospace" text-anchor="end" class="bracket">
    &lt;
  </text>

  <g transform="translate(30,30)">
    <circle cx="20" cy="20" r="20" class="outer-circle" />
    <circle cx="20" cy="14" r="8" class="hollow-circle" />
    <path d="M8,32 A12,10 0 0,1 32,32" class="semicircle-path" />
  </g>

  <text
    x="70"
    y="68"
    font-size="48"
    font-family="monospace"
    text-anchor="start"
    class="bracket"
  >
    &gt;
  </text>
</svg>