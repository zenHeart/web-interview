<style>
   .container {
      height: 60vh;
      width: 50vh;
      border: 2px solid red;
      overflow: scroll;
   }
   .container-info {
      flex-direction: column;
      gap: 10px;
      margin-top: 10px;
      font-size: 16px;
   }
</style>
<div class="container">
</div>
<div class="container-info">
   <strong id="scrollHeight"></strong>
   <strong id="scrollTop"></strong>
   <strong id="clientHeight"></strong>
</div>
<script>
   const container = document.querySelector('.container');
   const fragment = document.createDocumentFragment();
   for (let i = 0; i < 10000; i++) {
      const item = document.createElement('div');
      item.className = 'item';
      item.textContent = i;
      item.style.height = `${Math.random() * 100 + 20}px`;
      item.style.border = '1px solid #000';
      item.style.background = `#${Math.floor(Math.random() * 16777215).toString(16)}`;
      fragment.appendChild(item);
   }
   container.appendChild(fragment);

   container.addEventListener('scroll', () => {
      document.getElementById('scrollTop').textContent = `scrollTop: ${container.scrollTop}px`;
      document.getElementById('scrollHeight').textContent = `scrollHeight: ${container.scrollHeight}px`;
      document.getElementById('clientHeight').textContent = `clientHeight: ${container.clientHeight}px`;
   });

   document.getElementById('scrollTop').textContent = `scrollTop: ${container.scrollTop}px`;
   document.getElementById('scrollHeight').textContent = `scrollHeight: ${container.scrollHeight}px`;
   document.getElementById('clientHeight').textContent = `clientHeight: ${container.clientHeight}px`;
</script>
