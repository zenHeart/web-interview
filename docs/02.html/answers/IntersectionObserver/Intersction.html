<style>
   .container {
      width: 400px;
      height: 400px;
      background: lightgray;
      overflow: auto;
      padding: 10px;
      border: 10px solid blue;
      margin: 20px;
   }
   .item {
      height: 160px;
      border: 10px solid red;
      background: cyan;
      padding:10px;
      margin: 10px;
      align-content: center;
      text-align: center;
   }
</style>
<div class="container">
   <div data-id="1" class="item">1</div>
   <div data-id="2" class="item">2</div>
   <div data-id="3"  class="item">3</div>
</div>
<script>
   function log(entries, observer) {
      console.log('observer', observer)
      console.table(entries)
   }
   const root = document.getElementsByClassName('container')[0]

   // 监听元素离开和进入
   // 注意交叉判断的是元素边框盒和
   //  entry.isIntersecting false 表示完全离开
   //  entry.isIntersecting true 表示
   // 注意不论元素采用何种定位或者变换，只关心和父容器的重叠关系
   // 交叉的判断是子元素的边框盒和父容器的边框盒
   const observer = new IntersectionObserver(log, {
      root
   })

   const items = document.getElementsByClassName('item')

   Array.from(items).forEach(item => {
      observer.observe(item)
   })



</script>
