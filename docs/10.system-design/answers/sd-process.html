<div style="font:14px/1.6 -apple-system,Segoe UI,Arial;">
  <h3>系统设计流程看板</h3>
  <ol>
    <li><b>目标与约束</b>：功能边界、SLA/SLO、时延、吞吐、成本</li>
    <li><b>容量估算</b>：DAU→峰值并发→QPS/TPS；读写比；带宽与存储</li>
    <li><b>架构与数据</b>：读写路径、缓存层级、分区与复制、索引</li>
    <li><b>弹性治理</b>：限流/熔断/降级、重试退避、隔离与超时</li>
    <li><b>可观测性</b>：日志、指标、链路；SLO 报警与容量回归</li>
    <li><b>发布与演进</b>：灰度、回滚、压测、成本与风险权衡记录</li>
  </ol>
  <p style="color:#666">该页仅为最小可视化清单，用于面试/复盘时快速对齐话术。</p>
</div>
