<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial; }
    .btn { padding:6px 10px; }
    .pop { position:absolute; background:#000; color:#fff; padding:6px 8px; border-radius:4px; transform: translate(-50%, -8px); white-space: nowrap; display:none }
  </style>
</head>
<body>
  <div style="position: relative; padding: 40px;">
    <button id="btn" class="btn">Hover 我</button>
    <div id="pop" class="pop">这是 Popover</div>
  </div>
  <script>
    const btn = document.getElementById('btn')
    const pop = document.getElementById('pop')
    btn.addEventListener('mouseenter', ()=>{
      const r = btn.getBoundingClientRect()
      const host = btn.offsetParent.getBoundingClientRect()
      pop.style.left = (r.left - host.left + r.width/2) + 'px'
      pop.style.top = (r.top - host.top) + 'px'
      pop.style.display = 'block'
    })
    btn.addEventListener('mouseleave', ()=> pop.style.display = 'none')
  </script>
</body>
</html>
