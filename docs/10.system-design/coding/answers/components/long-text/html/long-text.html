<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      .lt{overflow:hidden;line-height:20px;padding-right:20px;transition:max-height .2s ease}
      .lt-btn{margin-top:6px}
    </style>
  </head>
  <body>
    <div id="t" class="lt" style="max-height:60px"></div>
    <button id="btn" class="lt-btn">展开</button>
    <script>
      const txt='这是一段可能很长的文本，初始显示收起，点击展开查看更多内容。'.repeat(10)
      const t=document.getElementById('t'), btn=document.getElementById('btn'); t.textContent=txt
      btn.onclick=()=>{ const open=t.style.maxHeight==='none'; t.style.maxHeight=open?'60px':'none'; btn.textContent=open?'展开':'收起' }
    </script>
  </body>
</html>
