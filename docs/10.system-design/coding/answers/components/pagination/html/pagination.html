<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      .pager{display:flex;align-items:center;gap:8px}
      .pager-btn{padding:4px 8px}
      .pager-list{display:flex;gap:4px;list-style:none;margin:0;padding:0}
      .pager-page{padding:4px 8px;border:1px solid #d9d9d9;border-radius:4px;background:#fff;cursor:pointer}
      .pager-page.is-current{background:#1677ff;color:#fff;border-color:#1677ff}
      .pager-ellipsis{padding:4px 8px;color:#999}
    </style>
  </head>
  <body>
    <nav class="pager" role="navigation" aria-label="Pagination">
      <button class="pager-btn" id="prev">上一页</button>
      <ul class="pager-list" id="list"></ul>
      <button class="pager-btn" id="next">下一页</button>
    </nav>
    <div style="margin-top:8px">当前页：<span id="cur">1</span></div>
    <script>
      const total=200, pageSize=10; let current=1
      const totalPages = Math.max(1, Math.ceil(total/pageSize))
      function range(a,b){ const r=[]; for(let i=a;i<=b;i++) r.push(i); return r }
      function pages(){
        if (totalPages<=7) return range(1,totalPages)
        const left=Math.max(2,current-1), right=Math.min(totalPages-1,current+1)
        const arr=[1]; if (left>2) arr.push('...'); arr.push(...range(left,right)); if (right<totalPages-1) arr.push('...'); arr.push(totalPages); return arr
      }
      function render(){
        document.getElementById('prev').disabled = current===1
        document.getElementById('next').disabled = current===totalPages
        const list=document.getElementById('list'); list.innerHTML=''
        pages().forEach((p,i)=>{
          if(p==='...'){ const li=document.createElement('li'); li.className='pager-ellipsis'; li.textContent='…'; list.appendChild(li); return }
          const li=document.createElement('li'); const btn=document.createElement('button'); btn.className='pager-page'+(p===current?' is-current':''); btn.textContent=String(p); btn.onclick=()=>{ current=p; render() }; if(p===current) btn.setAttribute('aria-current','page'); li.appendChild(btn); list.appendChild(li)
        })
        document.getElementById('cur').textContent=String(current)
      }
      document.getElementById('prev').onclick=()=>{ if(current>1){ current--; render() } }
      document.getElementById('next').onclick=()=>{ if(current<totalPages){ current++; render() } }
      render()
    </script>
  </body>
</html>
