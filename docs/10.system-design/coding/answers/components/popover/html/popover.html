<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      .pop-trigger{padding:6px 12px;border:1px solid #d9d9d9;border-radius:6px;background:#fff;cursor:pointer}
      .popover{position:absolute;background:#fff;border:1px solid #d9d9d9;border-radius:6px;box-shadow:0 6px 16px rgba(0,0,0,.08);padding:8px 12px;z-index:1000}
    </style>
  </head>
  <body>
    <button id="btn" class="pop-trigger">打开 Popover</button>
    <div id="pop" class="popover" style="display:none">这是一段 Popover 内容</div>
    <script>
      const btn = document.getElementById('btn'), pop = document.getElementById('pop')
      let open=false
      function compute(){
        const tr = btn.getBoundingClientRect(), pr = pop.getBoundingClientRect()
        let top = tr.bottom + 8, left = tr.left + tr.width/2 - pr.width/2
        const vw = window.innerWidth, vh = window.innerHeight
        if (top + pr.height > vh) top = tr.top - pr.height - 8
        if (left + pr.width > vw) left = vw - pr.width - 8
        if (left < 0) left = 8
        pop.style.top = (top + window.scrollY) + 'px'
        pop.style.left = (left + window.scrollX) + 'px'
      }
      btn.onclick = ()=>{ open=!open; pop.style.display=open?'block':'none'; if (open){ compute() } }
      window.addEventListener('scroll', ()=> open && compute(), { passive:true })
      window.addEventListener('resize', ()=> open && compute())
    </script>
  </body>
</html>
