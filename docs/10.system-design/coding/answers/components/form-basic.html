<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial; }
    .row { margin: 8px 0 }
    .err { color: #d4380d; font-size: 12px }
    .input { padding:6px 8px; border:1px solid #d9d9d9; border-radius:4px }
    .btn { padding:6px 10px; background:#1677ff; border:none; color:#fff; border-radius:4px; cursor:pointer }
  </style>
</head>
<body>
  <form id="f">
    <div class="row">
      <label>用户名：</label>
      <input id="name" class="input" />
      <div id="e1" class="err"></div>
    </div>
    <div class="row">
      <label>邮箱：</label>
      <input id="mail" class="input" />
      <div id="e2" class="err"></div>
    </div>
    <button class="btn" type="submit">提交</button>
  </form>
  <script>
    const f = document.getElementById('f')
    f.addEventListener('submit', (e)=>{
      e.preventDefault()
      let ok = true
      const name = document.getElementById('name').value.trim()
      const mail = document.getElementById('mail').value.trim()
      document.getElementById('e1').textContent = ''
      document.getElementById('e2').textContent = ''
      if (!name) { document.getElementById('e1').textContent = '请输入用户名'; ok = false }
      if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(mail)) { document.getElementById('e2').textContent = '邮箱格式不正确'; ok = false }
      if (ok) alert('提交成功: ' + JSON.stringify({ name, mail }))
    })
  </script>
</body>
</html>
