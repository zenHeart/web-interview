<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <style>
      .text-overflow {
        max-height: 60px;
        overflow: hidden;
        position: relative;
        line-height: 20px;
        padding-right: 20px;
        transition: max-height 0.3s ease;
        border: 1px solid #eee;
        padding: 12px;
        border-radius: 8px;
      }
      button {
        margin-top: 8px;
      }
    </style>
  </head>
  <body>
    <div id="textContainer" class="text-overflow">
      这是一段可能很长的文本，我们希望在一开始时只显示部分，点击“展开”按钮后显示全部内容，再次点击则“收起”文本。为了演示效果，这里增加了一些冗长的内容：在现代前端开发中，良好的交互体验尤为重要，通过合理的动画与过渡可以提升感知质量。同时也要注意性能与可访问性，避免给用户带来负担。
    </div>
    <button id="toggleButton">展开</button>
    <script>
      document.getElementById('toggleButton').addEventListener('click', function () {
        const textContainer = document.getElementById('textContainer');
        const button = document.getElementById('toggleButton');
        if (button.textContent === '展开') {
          textContainer.style.maxHeight = '1000px';
          button.textContent = '收起';
        } else {
          textContainer.style.maxHeight = '60px';
          button.textContent = '展开';
        }
      });
    </script>
  </body>
  </html>
