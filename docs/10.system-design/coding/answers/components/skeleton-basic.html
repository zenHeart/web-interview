<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial; }
    .skeleton { display:flex; flex-direction:column; gap:8px; width: 320px }
    .bar { height: 12px; background: linear-gradient(90deg,#eee,#f5f5f5,#eee); background-size: 200% 100%; animation: shimmer 1.2s infinite }
    .bar.sm { width:60% }
    .bar.md { width:80% }
    @keyframes shimmer { 0% { background-position: 200% 0 } 100% { background-position: -200% 0 } }
  </style>
</head>
<body>
  <div id="box">
    <div class="skeleton" aria-busy="true" aria-live="polite">
      <div class="bar"></div>
      <div class="bar md"></div>
      <div class="bar sm"></div>
    </div>
  </div>
  <script>
    setTimeout(()=>{
      document.getElementById('box').innerHTML = '<h4>内容标题</h4><p>真实内容加载完成。</p>'
    }, 1200)
  </script>
</body>
</html>
