<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial; }
    .box { width: 320px }
    .search { width: 100%; padding: 6px 8px; border:1px solid #d9d9d9; border-radius:4px; margin-bottom:8px }
    .list { max-height: 180px; overflow: auto; border:1px solid #eee; border-radius:4px }
    .item { padding:8px; cursor:pointer }
    .item:hover { background:#f5f5f5 }
    .empty { color:#999; padding:12px }
  </style>
</head>
<body>
  <div class="box">
    <input id="q" class="search" placeholder="搜索..." />
    <div id="list" class="list"></div>
  </div>
  <script>
    const options = Array.from({length: 500}, (_,i)=>({ value: i, label: '选项 ' + i }))
    const q = document.getElementById('q')
    const list = document.getElementById('list')
    function render(items){
      if (!items.length) { list.innerHTML = '<div class="empty">无结果</div>'; return }
      list.innerHTML = items.slice(0, 100).map(o=>`<div class="item" data-v="${o.value}">${o.label}</div>`).join('')
    }
    function onInput(){
      const kw = q.value.trim().toLowerCase()
      const res = kw ? options.filter(o=>o.label.toLowerCase().includes(kw)) : options
      render(res)
    }
    q.addEventListener('input', debounce(onInput, 200))
    list.addEventListener('click', (e)=>{
      const v = e.target.closest('.item')?.dataset.v
      if (v) alert('选择: ' + v)
    })
    function debounce(fn, wait){ let t; return (...args)=>{ clearTimeout(t); t=setTimeout(()=>fn(...args), wait) } }
    render(options)
  </script>
</body>
</html>
