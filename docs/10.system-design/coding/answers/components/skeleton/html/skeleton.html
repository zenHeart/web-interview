<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      .sk{display:flex;flex-direction:column;gap:6px}
      .sk-line{height:12px;background:linear-gradient(90deg,#f2f3f5,#e6e8eb,#f2f3f5);background-size:200% 100%;animation:shine 1.2s infinite}
      .sk-line.short{width:60%}
      @keyframes shine{0%{background-position:200% 0}100%{background-position:-200% 0}}
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      const root = document.getElementById('root')
      root.innerHTML = '<div class="sk"><div class="sk-line"></div><div class="sk-line"></div><div class="sk-line short"></div></div>'
      setTimeout(()=>{ root.textContent='内容已加载' }, 1000)
    </script>
  </body>
</html>
