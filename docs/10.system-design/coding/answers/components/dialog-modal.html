<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial; }
    .btn { padding: 8px 12px; background:#1677ff; color:#fff; border:none; border-radius:4px; cursor:pointer }
    .mask { position: fixed; inset: 0; background: rgba(0,0,0,.45); display:flex; align-items:center; justify-content:center }
    .dialog { background:#fff; border-radius:8px; width: 360px; max-width: 90vw; padding: 16px; box-shadow: 0 8px 24px rgba(0,0,0,.2) }
    .dialog header { font-weight: 600; margin-bottom: 8px }
    .footer { display:flex; gap:8px; justify-content:flex-end; margin-top: 12px }
    .input { width: 100%; padding: 6px 8px; border: 1px solid #d9d9d9; border-radius: 4px }
  </style>
</head>
<body>
  <button id="open" class="btn">打开对话框</button>

  <script>
    const openBtn = document.getElementById('open')
    function trapFocus(e, root) {
      if (e.key !== 'Tab') return
      const focusable = root.querySelectorAll('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])')
      const first = focusable[0]
      const last = focusable[focusable.length - 1]
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus() }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus() }
    }
    function openDialog() {
      const mask = document.createElement('div')
      mask.className = 'mask'
      mask.innerHTML = `
        <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="title">
          <header id="title">示例对话框</header>
          <div>
            <input class="input" placeholder="输入点什么..." data-autofocus />
          </div>
          <div class="footer">
            <button id="cancel">取消</button>
            <button id="ok" class="btn">确定</button>
          </div>
        </div>`
      document.body.appendChild(mask)
      const dialog = mask.querySelector('.dialog')
      dialog.querySelector('[data-autofocus]').focus()
      function onKey(e){ if (e.key==='Escape') close(); trapFocus(e, dialog) }
      function onClick(e){ if (e.target === mask) close() }
      function close(){
        document.removeEventListener('keydown', onKey)
        mask.removeEventListener('click', onClick)
        mask.remove(); openBtn.focus()
      }
      document.addEventListener('keydown', onKey)
      mask.addEventListener('click', onClick)
      dialog.querySelector('#cancel').onclick = close
      dialog.querySelector('#ok').onclick = close
    }
    openBtn.onclick = openDialog
  </script>
</body>
</html>
