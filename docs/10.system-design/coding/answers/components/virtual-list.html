<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <style>
      .scroll-container {
        position: relative;
        height: 300px;
        overflow: auto;
        border: 1px solid #ddd;
      }
      .list-item {
        position: absolute;
        left: 0;
        right: 0;
        height: 30px;
        line-height: 30px;
        padding: 0 8px;
        border-bottom: 1px solid #f0f0f0;
        box-sizing: border-box;
        background: #fff;
      }
    </style>
  </head>
  <body>
    <div class="scroll-container" id="container"></div>
    <script>
      class VirtualScroll {
        constructor(container, itemHeight, totalItems, renderCallback) {
          this.container = container;
          this.itemHeight = itemHeight;
          this.totalItems = totalItems;
          this.renderCallback = renderCallback;

          this.viewportHeight = container.clientHeight;
          this.bufferSize = Math.ceil(this.viewportHeight / itemHeight) * 3;
          this.startIndex = 0;
          this.endIndex = Math.min(totalItems, this.bufferSize);

          this.spacer = document.createElement('div');
          this.spacer.style.height = String(this.totalItems * this.itemHeight) + 'px';
          this.container.appendChild(this.spacer);

          this.container.addEventListener('scroll', () => this.onScroll());
          this.update();
        }

        onScroll() {
          const scrollTop = this.container.scrollTop;
          const newStartIndex = Math.max(0, Math.floor(scrollTop / this.itemHeight) - Math.floor(this.bufferSize / 3));
          const newEndIndex = Math.min(this.totalItems, newStartIndex + this.bufferSize);
          if (newStartIndex !== this.startIndex || newEndIndex !== this.endIndex) {
            this.startIndex = newStartIndex;
            this.endIndex = newEndIndex;
            this.update();
          }
        }

        update() {
          // 清理之前的已渲染项
          Array.from(this.container.querySelectorAll('.list-item')).forEach((el) => el.remove());

          // 渲染
          const fragment = document.createDocumentFragment();
          for (let i = this.startIndex; i < this.endIndex; i++) {
            const item = this.renderCallback(i);
            item.style.top = String(i * this.itemHeight) + 'px';
            fragment.appendChild(item);
          }
          this.container.appendChild(fragment);
        }
      }

      function createItem(index) {
        const item = document.createElement('div');
        item.className = 'list-item';
        item.textContent = 'Item ' + index;
        return item;
      }

      const container = document.getElementById('container');
      new VirtualScroll(container, 30, 2000, createItem);
    </script>
  </body>
  </html>
