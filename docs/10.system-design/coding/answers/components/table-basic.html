<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial; }
    .table { border-collapse: collapse; width: 100%; max-width: 680px }
    .table th, .table td { border:1px solid #eee; padding:8px 12px; white-space: nowrap }
    .thead { position: sticky; top:0; background:#fafafa }
    .wrap { height: 220px; overflow: auto; border:1px solid #eee }
  </style>
</head>
<body>
  <div class="wrap">
    <table class="table">
      <thead class="thead">
        <tr>
          <th>姓名</th>
          <th>部门</th>
          <th>分数</th>
        </tr>
      </thead>
      <tbody id="tb"></tbody>
    </table>
  </div>
  <script>
    const data = Array.from({length: 200}, (_,i)=>({ name:`用户${i+1}`, dept:i%2? '研发':'产品', score: Math.round(Math.random()*100) }))
    const tb = document.getElementById('tb')
    tb.innerHTML = data.map(r=>`<tr><td>${r.name}</td><td>${r.dept}</td><td>${r.score}</td></tr>`).join('')
  </script>
</body>
</html>
