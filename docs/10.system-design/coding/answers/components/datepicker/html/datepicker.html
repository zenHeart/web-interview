<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
  </head>
  <body>
    <input type="date" id="dp" min="2020-01-01" max="2030-12-31" aria-label="日期选择" />
    <div style="margin-top:8px">当前日期：<span id="val">未选择</span></div>
    <script>
      const dp = document.getElementById('dp'), val = document.getElementById('val')
      dp.addEventListener('input', ()=>{ val.textContent = dp.value || '未选择' })
    </script>
  </body>
</html>
