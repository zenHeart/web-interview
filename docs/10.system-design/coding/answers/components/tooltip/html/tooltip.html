<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      .tip-trigger{position:relative;border-bottom:1px dashed #999;cursor:help}
      .tooltip{position:absolute;background:#000;color:#fff;padding:4px 8px;border-radius:4px;font-size:12px;z-index:1000}
    </style>
  </head>
  <body>
    <span id="t" class="tip-trigger" tabindex="0">悬停查看</span>
    <div id="tip" class="tooltip" style="display:none">提示内容</div>
    <script>
      const t=document.getElementById('t'), tip=document.getElementById('tip')
      function place(){ const tr=t.getBoundingClientRect(), pr=tip.getBoundingClientRect(); let left=tr.left+tr.width/2-pr.width/2; let top=tr.bottom+8; const vw=innerWidth; if(left+pr.width>vw) left=vw-pr.width-8; if(left<0) left=8; tip.style.left=(left+scrollX)+'px'; tip.style.top=(top+scrollY)+'px' }
      function show(){ tip.style.display='block'; place() }
      function hide(){ tip.style.display='none' }
      t.addEventListener('mouseenter', show); t.addEventListener('mouseleave', hide); t.addEventListener('focus', show); t.addEventListener('blur', hide)
    </script>
  </body>
</html>
