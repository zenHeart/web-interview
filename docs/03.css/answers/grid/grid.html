<style>
  .grid-container {
    display: grid;
    background: #f5f5f5;
    padding: 10px;
    margin: 10px 0;
    border: 2px solid #ddd;
    min-height: 80px;
    gap: 10px; /* gap 属性：网格间距 */
  }
  .grid-item {
    background: #e3f2fd;
    border: 1px solid #90caf9;
    padding: 15px;
    margin: 0;
    text-align: center;
  }
  .grid-basic {
    grid-template-columns: repeat(3, 1fr);
  }
  .grid-span {
    grid-column: span 2;
  }

  .grid-area-demo {
    grid-template-areas:
      "header header header"
      "sidebar main main"
      "footer footer footer";
    grid-template-columns: 100px 1fr 1fr;
    grid-template-rows: 40px 80px 40px;
  }
  .header {
    grid-area: header;
  }
  .sidebar {
    grid-area: sidebar;
  }
  .main {
    grid-area: main;
  }
  .footer {
    grid-area: footer;
  }
</style>

<h2>基本网格布局</h2>
<div class="grid-container grid-basic">
  <div class="grid-item">1</div>
  <div class="grid-item">2</div>
  <div class="grid-item">3</div>
  <div class="grid-item">4</div>
  <div class="grid-item">5</div>
  <div class="grid-item">6</div>
</div>

<h2>跨列与跨行</h2>
<div class="grid-container grid-basic">
  <div class="grid-item grid-span">跨两列</div>
  <div class="grid-item">B</div>
  <div class="grid-item">C</div>
  <div class="grid-item">D</div>
  <div class="grid-item">E</div>
</div>

<h2>命名区域（grid-template-areas）</h2>
<div class="grid-container grid-area-demo">
  <div class="grid-item header">Header</div>
  <div class="grid-item sidebar">Sidebar</div>
  <div class="grid-item main">Main</div>
  <div class="grid-item footer">Footer</div>
</div>
