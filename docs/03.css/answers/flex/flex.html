<style>
   .flex-container {
      display: flex;
      background: #f5f5f5;
      padding: 10px;
      margin: 10px 0;
      border: 2px solid #ddd;
      min-height: 80px;
      gap: 10px; /* gap 属性：项目间距 */
   }
   .flex-item {
      background: #e3f2fd;
      border: 1px solid #90caf9;
      padding: 15px;
      margin: 5px;
   }
   .horizontal {
      flex-direction: row; /* 主轴为水平方向 */
      justify-content: space-between; /* 主轴两端对齐 */
   }
   .vertical {
      flex-direction: column; /* 主轴为垂直方向 */
      height: 200px;
      align-items: flex-end; /* 交叉轴末尾对齐 */
   }
   .center {
      justify-content: center; /* 主轴居中 */
      align-items: center;     /* 交叉轴居中 */
      height: 120px;
   }
   .grow-item {
      flex-grow: 1; /* 自动放大，占据剩余空间 */
   }
   .fixed-item {
      flex-shrink: 0; /* 不缩小 */
      width: 100px;
   }
   .wrap {
      flex-wrap: wrap; /* 允许换行 */
      width: 300px;
      align-content: space-between; /* 多行分布 */
   }
   .wrap .flex-item {
      width: 80px;
      flex-shrink: 0;
   }
   .order-demo .flex-item:nth-child(2) {
      order: 3; /* 改变项目顺序 */
   }
   .align-self-demo .flex-item:last-child {
      align-self: flex-end; /* 单独对齐 */
   }
</style>

<h2>主轴方向与对齐</h2>
<div class="flex-container horizontal">
   <div class="flex-item">左侧</div>
   <div class="flex-item">中间</div>
   <div class="flex-item">右侧</div>
</div>

<h2>垂直排列与交叉轴对齐</h2>
<div class="flex-container vertical">
   <div class="flex-item">顶部项目</div>
   <div class="flex-item">中间项目</div>
   <div class="flex-item">底部项目</div>
</div>

<h2>居中对齐</h2>
<div class="flex-container center">
   <div class="flex-item">完全居中</div>
</div>

<h2>弹性伸缩（flex-grow, flex-shrink）</h2>
<div class="flex-container">
   <div class="flex-item fixed-item">固定宽度</div>
   <div class="flex-item grow-item">自动伸展</div>
   <div class="flex-item fixed-item">固定宽度</div>
</div>

<h2>换行与多行对齐（flex-wrap, align-content）</h2>
<div class="flex-container wrap">
   <div class="flex-item">项目1</div>
   <div class="flex-item">项目2</div>
   <div class="flex-item">项目3</div>
   <div class="flex-item">项目4</div>
   <div class="flex-item">项目5</div>
</div>

<h2>项目顺序（order）</h2>
<div class="flex-container order-demo">
   <div class="flex-item">项目1</div>
   <div class="flex-item">项目2(顺序3)</div>
   <div class="flex-item">项目3</div>
</div>

<h2>单独对齐（align-self）</h2>
<div class="flex-container align-self-demo" style="height:100px;align-items:flex-start;">
   <div class="flex-item">顶部</div>
   <div class="flex-item">顶部</div>
   <div class="flex-item">底部(align-self)</div>
</div>
