<style>
  .container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 16px;
  }
  .row {
    display: grid;
    grid-template-columns: repeat(12, 1fr);
    gap: 16px;
    margin-bottom: 16px;
  }
  .col-1 {
    grid-column: span 1;
  }
  .col-2 {
    grid-column: span 2;
  }
  .col-3 {
    grid-column: span 3;
  }
  .col-4 {
    grid-column: span 4;
  }
  .col-6 {
    grid-column: span 6;
  }
  .col-12 {
    grid-column: span 12;
  }
  .box {
    background: #e3e3e3;
    border-radius: 4px;
    padding: 24px;
    text-align: center;
    font-weight: bold;
  }
</style>
<h1>Grid 实现 Bootstrap 栅格系统</h1>
<div class="container">
  <div class="row">
    <div class="col-4 box">.col-4</div>
    <div class="col-4 box">.col-4</div>
    <div class="col-4 box">.col-4</div>
  </div>
  <div class="row">
    <div class="col-6 box">.col-6</div>
    <div class="col-6 box">.col-6</div>
  </div>
  <div class="row">
    <div class="col-12 box">.col-12</div>
  </div>
</div>
