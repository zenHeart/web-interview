<style>
  .unselectable-text {
    background: #ffe8e8;
    padding: 15px;
    border-radius: 5px;
    margin: 10px 0;
    -webkit-user-select: none;
    -moz-user-select: none;
    -ms-user-select: none;
    user-select: none;
  }
</style>
<div class="unselectable-text">
  这是一段不可选中的文本，通过 CSS 的 user-select: none
  实现。你可以尝试选中这段文字，但会发现无法选中。
</div>
