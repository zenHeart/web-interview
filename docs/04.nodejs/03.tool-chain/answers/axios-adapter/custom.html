<script type="module">
  import axios from "https://esm.sh/axios";
  import settle from "https://esm.sh/axios/lib/core/settle.js";

  function customAdapter(config) {
   return new Promise((resolve, reject) => {
      const response = {
         data: {
            custom: "mock adapter",
         },
         status: 200,
         statusText: "OK",
         headers: {},
         config,
         request: {}
      };
      // 内部的校验函数用来判断 response 是否有效，通过 status 判断失败类型
      // 可以扩充字段
      // 非必须
      settle(resolve, reject, response);
   });
  }

  axios
    .get("https://jsonplaceholder.typicode.com/todos/1", {
      adapter: customAdapter
    })
    .then((res) => {
      console.log(res.data);
    })
    .catch((error) => {
      console.error(error);
    });
</script>
