<script type="module">
  import axios from "https://esm.sh/axios";

  // 整体拦截器执行符合洋葱模型
  // 请求拦截器按照栈后注入的先执行
  const index = axios.interceptor.request.use(
    (config) => {
      console.log("Request Interceptor 1:", config);
      return config;
    }
  );
  axios.interceptor.request.use(
    (config) => {
      console.log("Request Interceptor 2:", config);
      return config;
    }
  );
  axios.interceptor.response.use(
    (config) => {
      console.log("Response Interceptor 1:", config);
      return config;
    }
  );

  axios.get("https://jsonplaceholder.typicode.com/todos/1");


  // 清楚拦截器 1, 不会触发拦截器 1， 因为被取消了
  axios.interceptor.request.eject(index);
  axios.get("https://jsonplaceholder.typicode.com/todos/1");

  // 没有输出所有拦截器都被取消了
  axios.interceptor.request.clear();
  axios.get("https://jsonplaceholder.typicode.com/todos/1");

</script>
