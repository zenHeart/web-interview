<!-- 嵌入SVG代码，尺寸已修改为 100x100 -->
<!-- Embed SVG code, dimensions modified to 100x100 -->
<svg
  width="100"
  height="100"
  viewBox="0 0 100 100"
  xmlns="http://www.w3.org/2000/svg"
>
  <!-- 左括号 -->
  <!-- Left bracket, positioned to end at x=30 and vertically centered -->
  <text x="30" y="68" font-size="48" font-family="monospace" text-anchor="end">
    &lt;
  </text>

  <!-- 头像轮廓组，调整了X和Y轴平移量使其在SVG画布中心垂直水平居中 -->
  <!-- Avatar outline group, adjusted X and Y translations for vertical and horizontal centering within the SVG canvas -->
  <!-- The avatar's internal center is (20,20), so translate(30,30) places it at (30+20, 30+20) = (50,50) -->
  <g transform="translate(30,30)">
    <!-- 外圆（身体轮廓） -->
    <!-- Outer circle (body outline) -->
    <circle cx="20" cy="20" r="20" fill="#000" />
    <!-- 头像空心圈（裁剪头像） -->
    <!-- Hollow head circle (for avatar clipping) -->
    <circle cx="20" cy="14" r="8" fill="#fff" />
    <!-- 下方半圆弧表示肩膀 -->
    <!-- Lower semicircle representing shoulders -->
    <path d="M8,32 A12,10 0 0,1 32,32" fill="#fff" />
  </g>

  <!-- 右括号 -->
  <!-- Right bracket, positioned to start at x=70 and vertically centered -->
  <text
    x="70"
    y="68"
    font-size="48"
    font-family="monospace"
    text-anchor="start"
  >
    &gt;
  </text>
</svg>
